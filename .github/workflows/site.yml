name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"  # weekly refresh from Arazim (Mondays 04:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Cloudflare (primary host): repository secrets; the Cloudflare step is skipped when unset
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so refresh and deploy in one job
      - name: Refresh course data
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/update_data.py
          git add -A data  # the data is split into files that come and go with units and programs
          if ! git diff --cached --quiet -- data; then
            python -m pytest tests/test_data.py -q
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update course data"
            git pull --rebase
            git push
          fi

      - name: Test data and site
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium-headless-shell
          python -m pytest tests -q

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html course_graph.html _headers assets data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
